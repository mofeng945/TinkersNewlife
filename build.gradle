// ============================================================
//  §1255 三模拆分：根构建只做聚合
//  结构：:common（公共层 + 现有全部内容，过渡期）  :cursed（咒术）  :imagination（奇想）  :apostle（使徒增强）
//  gradlew build 会顺带构建所有子项目，现有流程一个字不用改。
// ============================================================

subprojects {
    plugins.withId('java') {
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }
    }
}