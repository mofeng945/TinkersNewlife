// ============================================================
//  §1255 三模拆分：根构建只做聚合
//  结构：:common（公共层 + 现有全部内容，过渡期）  :cursed（咒术）  :imagination（奇想）  :apostle（使徒增强）
//  gradlew build 会顺带构建所有子项目，现有流程一个字不用改。
// ============================================================

subprojects {
    plugins.withId('java') {
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }
    }
}

// ============================================================
//  §1269 **把四个子项目的产物合成一个 jar** (user: keep it ONE jar first)
//  -- the source stays split into four Gradle projects (ready for the real
//     split later), but the shipped artifact is a SINGLE jar again.
//  -- mods.toml / pack.mcmeta come from :common only, so the mod id stays
//     `tinkersnewlife` and nothing about the installed mod changes.
// ============================================================
tasks.register('singleJar', Jar) {
    // §1270 ONE-JAR MODE: the merged jar must declare ONLY modId `tinkersnewlife`,
    // so the three separate @Mod entry classes have to be kept OUT of it.
    // (Otherwise Forge says: "mods.toml missing metadata for modid
    //  tinkersnewlife_cursed" + "has mods that were not found" and refuses to load.)
    dependsOn ':common:reobfJar', ':cursed:reobfJar', ':imagination:reobfJar', ':apostle:reobfJar'
    archiveBaseName = 'tinkersnewlife'
    archiveVersion = mod_version
    archiveClassifier = ''
    destinationDirectory = file("$rootDir/build/libs")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'com/mofengbaizhi/tinkersnewlife/cursed/TinkersNewlifeCursed*.class'
    exclude 'com/mofengbaizhi/tinkersnewlife/imagination/TinkersNewlifeImagination*.class'
    exclude 'com/mofengbaizhi/tinkersnewlife/apostle/TinkersNewlifeApostle*.class'
    manifest {
        attributes('MixinConfigs': 'tinkersnewlife.mixins.json')
    }
    from({ zipTree(project(':common').tasks.named('jar').get().archiveFile.get().asFile) })
    from({ zipTree(project(':cursed').tasks.named('jar').get().archiveFile.get().asFile) }) {
        exclude 'META-INF/**'
    }
    from({ zipTree(project(':imagination').tasks.named('jar').get().archiveFile.get().asFile) }) {
        exclude 'META-INF/**'
    }
    from({ zipTree(project(':apostle').tasks.named('jar').get().archiveFile.get().asFile) }) {
        exclude 'META-INF/**'
    }
}